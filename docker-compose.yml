services:
  db:
    image: postgres:16-alpine
    container_name: quorum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
      POSTGRES_DB: quorum_db
    ports:
      - "5432:5432"
    volumes:
      - quorum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorum -d quorum_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quorum-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://quorum:quorum@db:5432/quorum_db
      ADMIN_API_KEY: quorum-admin-secret
      JWT_SECRET_KEY: quorum-dev-jwt-secret
      CORS_ORIGINS: http://localhost:5173
      ENABLE_SCHEDULER: "true"
    ports:
      - "8000:8000"

volumes:
  quorum_pgdata:
